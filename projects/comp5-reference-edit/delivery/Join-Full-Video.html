<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Join Comp 5 — 4K video</title><style>body{font:18px system-ui;max-width:720px;margin:80px auto;padding:24px;background:#111;color:#fff;line-height:1.6}button,input{font:inherit;margin:16px 0}button{padding:12px 22px;cursor:pointer}a{color:#add8ff}</style><h1>Comp 5 — full 4K video</h1><p>Select every downloaded <code>Comp-5-reference-edit-4K.mp4.partXX</code> file. This joins the parts locally in your browser. Your video is not uploaded anywhere.</p><input id="files" type="file" multiple><p><button id="join">Join and save MP4</button></p><p id="status"></p><script>
const status=document.getElementById('status');document.getElementById('join').onclick=async()=>{try{const files=[...document.getElementById('files').files].sort((a,b)=>a.name.localeCompare(b.name));if(files.length!==3)throw Error('Select all three video parts.');const manifest=await fetch('manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).catch(()=>null);for(let i=0;i<files.length;i++){const expected='Comp-5-reference-edit-4K.mp4.part'+String(i+1).padStart(2,'0');if(files[i].name!==expected)throw Error('Missing or unexpected part: expected '+expected);}if(manifest&&manifest.parts.length!==files.length)throw Error('Select all '+manifest.parts.length+' parts.');status.textContent='Preparing the joined video…';const blob=new Blob(files,{type:'video/mp4'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='Comp-5-reference-edit-4K.mp4';link.textContent='Save the full 4K MP4';link.click();status.replaceChildren(link);}catch(e){status.textContent=e.message}};
</script></html>
