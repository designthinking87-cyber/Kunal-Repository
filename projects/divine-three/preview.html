<!doctype html><html><head><meta charset="utf-8"><title>Enduring light — editable preview</title><style>body{background:#07131f;color:#fff1d4;font:16px system-ui;display:flex;align-items:center;justify-content:center;gap:30px;margin:25px}.viewport{width:324px;height:576px;overflow:hidden;box-shadow:0 8px 50px #000}iframe{width:1080px;height:1920px;border:0;transform:scale(.3);transform-origin:0 0}aside{max-width:350px}input{width:100%;accent-color:#e8bd65}button{padding:12px 25px;background:#e8bd65;border:0;border-radius:6px;margin:12px 0;cursor:pointer}p{line-height:1.6;opacity:.8}</style></head><body><div class="viewport"><iframe src="scene.html" id="scene"></iframe></div><aside><h1>The light that stays</h1><p>Three.js cinematic sequence. Scrub through the 15-second scene or play it here. Rendering uses the same absolute-time scene function.</p><input type="range" min="0" max="15" step=".033333" value="0" id="time"><div id="label">0.00 / 15.00 seconds</div><button id="play">Play</button><p>Standalone sequence is silent. The assembled Short preserves the uploaded narration.</p></aside><script>let running=false,last=0,t=0;const input=document.querySelector('#time'),frame=document.querySelector('iframe');function draw(){if(frame.contentWindow.renderAt)frame.contentWindow.renderAt(t);input.value=t;document.querySelector('#label').textContent=t.toFixed(2)+' / 15.00 seconds'}input.oninput=()=>{t=+input.value;draw()};document.querySelector('#play').onclick=()=>{running=!running;if(t>=15)t=0;document.querySelector('#play').textContent=running?'Pause':'Play';last=performance.now()};function loop(n){if(running){t=Math.min(15,t+(n-last)/1000);draw();if(t>=15){running=false;document.querySelector('#play').textContent='Play'}}last=n;requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
